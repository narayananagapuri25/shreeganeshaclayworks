name: Google Search visibility

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # Mondays at 09:00 India Standard Time

permissions:
  contents: read

concurrency:
  group: google-search-visibility
  cancel-in-progress: false

jobs:
  visibility:
    name: Observe Google search visibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Search Google and record site visibility
        run: node scripts/google-search-visibility.mjs
      - name: Upload search results, diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-search-visibility
          path: |
            artifacts/google-search-visibility.json
            artifacts/google-search-visibility.md
            artifacts/google-search-*.png
          if-no-files-found: warn
          retention-days: 30
